plugins { id 'com.android.application' }
android {
    namespace 'io.github.ekkzy.softlumi.fixture'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'io.github.ekkzy.softlumi.fixture'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0-test-only'
    }
    flavorDimensions 'testApp'
    productFlavors {
        alpha { dimension 'testApp'; applicationIdSuffix '.alpha'; resValue 'string','app_name','ТЕСТ — Очень длинное русское название приложения для проверки фокуса' }
        beta { dimension 'testApp'; applicationIdSuffix '.beta'; resValue 'string','app_name','ТЕСТ — Б' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
