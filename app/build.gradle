plugins { id 'com.android.application' }

android {
    namespace 'io.github.ekkzy.softlumi'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'io.github.ekkzy.softlumi'
        minSdk 26
        targetSdk 35
        versionCode providers.gradleProperty('softlumiVersionCode').orElse('34').get().toInteger()
        versionName '0.3.0-candidate.13'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'boolean', 'CHANNEL_PROBE_ENABLED', providers.gradleProperty('softlumiChannelProbe').map { Boolean.parseBoolean(it).toString() }.orElse('false').get()
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    lint { abortOnError true; checkReleaseBuilds true; htmlReport true; xmlReport true; lintConfig rootProject.file('lint.xml') }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
